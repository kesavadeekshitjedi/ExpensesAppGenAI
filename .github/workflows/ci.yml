name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ExpensesApp.slnx
      - run: dotnet build ExpensesApp.slnx --no-restore --configuration Release
      - run: dotnet test ExpensesApp.slnx --no-build --configuration Release
      # Fails if the EF Core model changed without a matching migration being committed.
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/api/Expenses.Api.csproj

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
