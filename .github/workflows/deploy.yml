name: Deploy

# Runs after CI succeeds on main, so nothing is deployed that hasn't built and passed tests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-expenses-prod
  STACK_NAME: expenses-app
  # workflow_run: deploy exactly the commit CI tested. Manual run: the latest commit on the chosen branch.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # Only CI runs from pushes to main; CI runs for pull requests never deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Resource names and URLs come from the infrastructure stack, so they're never hardcoded twice.
      - name: Read infrastructure outputs
        run: |
          outputs=$(az stack group show --name "$STACK_NAME" --resource-group "$RESOURCE_GROUP" --query outputs -o json)
          {
            echo "API_URL=$(jq -r .apiUrl.value <<< "$outputs")"
            echo "WEB_URL=$(jq -r .webUrl.value <<< "$outputs")"
            echo "CONTAINER_APP_NAME=$(jq -r .containerAppName.value <<< "$outputs")"
            echo "REGISTRY_NAME=$(jq -r .registryName.value <<< "$outputs")"
            echo "REGISTRY_LOGIN_SERVER=$(jq -r .registryLoginServer.value <<< "$outputs")"
            echo "STATIC_WEB_APP_NAME=$(jq -r .staticWebAppName.value <<< "$outputs")"
            echo "SQL_SERVER_FQDN=$(jq -r .sqlServerFqdn.value <<< "$outputs")"
            echo "SQL_DATABASE=$(jq -r .sqlDatabaseName.value <<< "$outputs")"
            echo "API_IDENTITY_CLIENT_ID=$(jq -r .apiIdentityClientId.value <<< "$outputs")"
          } >> "$GITHUB_ENV"

      # ---------- API ----------

      - name: Sign in to the container registry
        run: az acr login --name "$REGISTRY_NAME"

      # The .NET SDK builds the image itself (no Dockerfile) on the official ASP.NET base image, listening on 8080.
      - name: Build and push API image
        run: |
          dotnet publish src/api/Expenses.Api.csproj \
            --configuration Release \
            /t:PublishContainer \
            -p:ContainerRegistry="$REGISTRY_LOGIN_SERVER" \
            -p:ContainerRepository=expenses-api \
            -p:ContainerImageTag="$COMMIT_SHA"
          echo "API_IMAGE=$REGISTRY_LOGIN_SERVER/expenses-api:$COMMIT_SHA" >> "$GITHUB_ENV"

      # ---------- Database ----------
      # Migrations run before the API image is switched. If any step here fails, the job stops and
      # the Container App keeps running the previous image (SPEC: migrations must be backward-compatible
      # with the running API, and a failed migration must not ship a new API).

      # Idempotent SQL for exactly the migrations in this commit; no database connection is made here.
      - name: Generate migration script
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent \
            --project src/api/Expenses.Api.csproj \
            --output "${{ runner.temp }}/migrate.sql"

      # The managed identity's database user is created WITH SID, derived from its client ID.
      - name: Compute API identity database SID
        shell: pwsh
        run: |
          $guid = [Guid]"${{ env.API_IDENTITY_CLIENT_ID }}"
          $sid = '0x' + [BitConverter]::ToString($guid.ToByteArray()).Replace('-', '')
          "API_IDENTITY_SID=$sid" | Out-File -FilePath $env:GITHUB_ENV -Append

      # go-sqlcmd (not the ODBC sqlcmd) is what supports --authentication-method ActiveDirectoryDefault.
      # It isn't an apt package for the runner's Ubuntu, so download the release binary and put it on PATH.
      - name: Install sqlcmd
        run: |
          curl -fsSL -o /tmp/sqlcmd.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
          mkdir -p /tmp/sqlcmd
          tar xjf /tmp/sqlcmd.tar.bz2 -C /tmp/sqlcmd
          echo "/tmp/sqlcmd" >> "$GITHUB_PATH"

      # Create the API identity's DB user, then apply migrations. Both scripts are idempotent.
      # Auth is the workflow's OIDC session (Active Directory Default); GitHub-hosted runners reach
      # the server through the SQL "Allow Azure services" rule (no password, no firewall change).
      # Azure SQL can return a transient "database is not currently available" (error 40613) on the
      # first connection to an idle Basic-tier database, so each script is retried.
      - name: Apply database changes
        run: |
          run_sql() {
            for attempt in $(seq 1 10); do
              if sqlcmd -S "$SQL_SERVER_FQDN" -d "$SQL_DATABASE" \
                   --authentication-method ActiveDirectoryDefault -b "$@"; then
                return 0
              fi
              echo "SQL attempt $attempt failed; retrying in 15s"
              sleep 15
            done
            echo "::error::SQL command did not succeed after 10 attempts"
            return 1
          }
          run_sql -i infra/sql/create-api-user.sql -v ApiIdentitySid="$API_IDENTITY_SID"
          run_sql -i "${{ runner.temp }}/migrate.sql"

      - name: Deploy API
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$API_IMAGE" \
            --output none

      # The app scales to zero, so the first request may wait for a cold start.
      - name: Smoke test API
        run: |
          for attempt in $(seq 1 18); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API_URL/health" || true)
            if [ "$status" = "200" ]; then
              echo "API healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status, retrying in 10s"
            sleep 10
          done
          echo "::error::API did not return 200 from $API_URL/health"
          exit 1

      # ---------- Web ----------

      - name: Build web app
        working-directory: src/web
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
        run: |
          npm ci
          npm run build

      # Static Web Apps only accepts uploads with its deployment token. It is fetched here with the OIDC
      # sign-in, masked in logs, and never stored in GitHub. There is no token-free upload option.
      - name: Get Static Web Apps deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy web app
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: src/web/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test web app
        run: |
          for attempt in $(seq 1 12); do
            if curl -s --max-time 20 "$WEB_URL" | grep -q '<title>Home Expenses</title>'; then
              echo "Web app is serving this build"
              exit 0
            fi
            echo "Attempt $attempt: new build not visible yet, retrying in 10s"
            sleep 10
          done
          echo "::error::$WEB_URL is not serving the Home Expenses app"
          exit 1
